version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Payload y sus paquetes deben actualizarse juntos, a la misma versión exacta.
      payload:
        patterns: ['payload', '@payloadcms/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
